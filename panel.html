<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de Invitados · Sheccid XV</title>
<style>
:root{--bg:#FAFAF6;--ink:#3A2F2A;--muted:#8A7A70;--accent:#AE9A8A;--accent-d:#7E6A5A;--line:#E4DCD6;--danger:#A65A4E;--ok:#4F7A5E}
*{box-sizing:border-box}
body{margin:0;font-family:Jost,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:#fff}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:22px;margin:0}
main{max-width:720px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:100%}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--accent);background:#fff;color:var(--accent-d);cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);color:#fff}
button.danger{border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin-top:12px;font-size:14px;color:var(--danger);min-height:1em}
.muted{color:var(--muted);font-size:14px}

/* Lista compacta: una línea por invitado */
#buscar{margin-bottom:12px}
.lista{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:#fff;text-align:left;color:var(--ink);font-size:16px}
.fila:last-child{border-bottom:none}
.fila:active{background:#F5F0EC}
.fila .boletos{font-size:13px;color:var(--muted);white-space:nowrap}

/* Ficha del invitado (sheet) */
.overlay{position:fixed;inset:0;background:rgba(58,47,42,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:16px 16px 0 0;padding:20px;display:grid;gap:10px}
.sheet h2{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:20px;margin:0}
.sheet button{width:100%;padding:12px;text-align:center}
@media (min-width:701px){.overlay{align-items:center}.sheet{border-radius:16px}}

@media (max-width:700px){
  header{padding:12px 16px}
  h1{font-size:18px}
  main{margin:16px auto;padding:0 12px}
  .card{padding:14px}
  .row{gap:8px}
  .row input,.row button{width:100%;flex:1 1 100%}
  #fBoletos{width:100%!important}
}
</style>
</head>
<body>
<header>
  <h1>Invitados · Sheccid XV</h1>
  <button id="btnSalir" hidden>Salir</button>
</header>

<main>
  <section id="login" class="card" hidden>
    <form id="formLogin" class="row">
      <input id="pass" type="password" placeholder="Contraseña del panel" autocomplete="current-password" style="flex:1;min-width:220px">
      <button class="primary" type="submit">Entrar</button>
    </form>
    <p id="loginMsg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <div class="card">
      <form id="form" class="row">
        <input id="fNombre" placeholder="Nombre (ej. Familia García)" required style="flex:2;min-width:200px">
        <input id="fBoletos" type="number" min="1" max="20" value="2" required style="width:110px">
        <button class="primary" type="submit" id="btnGuardar">Agregar invitado</button>
        <button type="button" id="btnCancelar" hidden>Cancelar</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>

    <div class="card" style="padding:14px">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <strong id="resumen"></strong>
      </div>
      <input id="buscar" placeholder="Buscar por nombre…" autocomplete="off">
      <div id="lista" class="lista"></div>
    </div>
  </section>
</main>

<!-- Ficha del invitado -->
<div id="modal" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="mNombre"></h2>
    <p id="mBoletos" class="muted" style="margin:0 0 6px"></p>
    <button onclick="accion(copiar)">Copiar link</button>
    <button onclick="accion(whatsapp)">Enviar por WhatsApp</button>
    <button onclick="accion(editar)">Editar</button>
    <button class="danger" onclick="accion(eliminar)">Eliminar</button>
    <button onclick="cerrar()">Cerrar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== CONFIGURACIÓN =====
const BASE = 'https://sheccid-xv.vercel.app/';
const API = '/api/invitados';
// =========================

const $ = id => document.getElementById(id);
let invitados = [];
let editandoId = null;
let seleccionadoId = null;
let pass = sessionStorage.getItem('panelPass') || '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkDe = token => `${BASE}?token=${encodeURIComponent(token)}`;
const buscarInv = id => invitados.find(x => x.id === id);
const etiquetaBoletos = n => `${n} ${n === 1 ? 'boleto' : 'boletos'}`;

function mostrarMsg(texto, esError = true) {
  $('msg').textContent = texto;
  $('msg').style.color = esError ? 'var(--danger)' : 'var(--ok)';
}

// Todas las operaciones pasan por la función de Vercel
async function llamar(body) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass, ...body }),
  });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.error || 'Error de servidor');
  return datos;
}

function mostrarPanel(activo) {
  $('login').hidden = activo;
  $('panel').hidden = !activo;
  $('btnSalir').hidden = !activo;
}

// ===== ACCESO =====
$('formLogin').onsubmit = async e => {
  e.preventDefault();
  pass = $('pass').value;
  try {
    invitados = await llamar({ action: 'list' });
    sessionStorage.setItem('panelPass', pass);
    $('loginMsg').textContent = '';
    mostrarPanel(true);
    render();
  } catch (err) {
    pass = '';
    $('loginMsg').textContent = err.message;
  }
};

$('btnSalir').onclick = () => {
  sessionStorage.removeItem('panelPass');
  pass = '';
  invitados = [];
  cerrar();
  mostrarPanel(false);
};

async function cargar() {
  try {
    invitados = await llamar({ action: 'list' });
    render();
  } catch (err) {
    mostrarMsg(err.message);
  }
}

// Al abrir: si ya había sesión en esta pestaña, entrar directo
(async () => {
  if (pass) {
    try {
      invitados = await llamar({ action: 'list' });
      mostrarPanel(true);
      render();
      return;
    } catch { pass = ''; sessionStorage.removeItem('panelPass'); }
  }
  mostrarPanel(false);
})();

// ===== LISTA Y BÚSQUEDA =====
function render() {
  const q = $('buscar').value.trim().toLowerCase();
  // Sin texto (o al borrarlo) se muestran todos
  const lista = q
    ? invitados.filter(i => i.nombre_corto.toLowerCase().includes(q))
    : invitados;
  const totalBoletos = invitados.reduce((acc, i) => acc + (i.boletos || 0), 0);
  $('resumen').textContent = `${invitados.length} invitados · ${totalBoletos} boletos`;

  $('lista').innerHTML = lista.map(i => `
    <button class="fila" onclick="abrir('${i.id}')">
      <span>${esc(i.nombre_corto)}</span>
      <span class="boletos">${esc(etiquetaBoletos(i.boletos))}</span>
    </button>`).join('')
    || `<p class="muted" style="padding:16px;margin:0">Sin resultados</p>`;
}

$('buscar').addEventListener('input', render);

// ===== FICHA DEL INVITADO =====
function abrir(id) {
  const i = buscarInv(id);
  if (!i) return;
  seleccionadoId = id;
  $('mNombre').textContent = i.nombre_corto;
  $('mBoletos').textContent = etiquetaBoletos(i.boletos);
  $('modal').hidden = false;
}

function cerrar() {
  $('modal').hidden = true;
  seleccionadoId = null;
}

// Cierra la ficha y ejecuta la acción sobre el invitado seleccionado
function accion(fn) {
  const id = seleccionadoId;
  cerrar();
  if (id) fn(id);
}

$('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') cerrar();
});

// ===== ALTA / EDICIÓN =====
$('form').onsubmit = async e => {
  e.preventDefault();
  const nombre_corto = $('fNombre').value.trim();
  const boletos = parseInt($('fBoletos').value, 10);
  $('btnGuardar').disabled = true;
  try {
    if (editandoId) {
      await llamar({ action: 'update', id: editandoId, nombre_corto, boletos });
    } else {
      await llamar({ action: 'create', nombre_corto, boletos });
    }
    mostrarMsg('Guardado', false);
    resetForm();
    await cargar();
  } catch (err) {
    mostrarMsg(err.message);
  } finally {
    $('btnGuardar').disabled = false;
  }
};

function resetForm() {
  editandoId = null;
  $('form').reset();
  $('fBoletos').value = 2;
  $('btnGuardar').textContent = 'Agregar invitado';
  $('btnCancelar').hidden = true;
}
$('btnCancelar').onclick = resetForm;

// ===== ACCIONES =====
function editar(id) {
  const i = buscarInv(id);
  editandoId = id;
  $('fNombre').value = i.nombre_corto;
  $('fBoletos').value = i.boletos;
  $('btnGuardar').textContent = 'Guardar cambios';
  $('btnCancelar').hidden = false;
  $('fNombre').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function eliminar(id) {
  const i = buscarInv(id);
  if (!confirm(`¿Eliminar a ${i.nombre_corto}? Su link dejará de funcionar.`)) return;
  try {
    await llamar({ action: 'delete', id });
    if (editandoId === id) resetForm();
    mostrarMsg('Eliminado', false);
    await cargar();
  } catch (err) {
    mostrarMsg(err.message);
  }
}

async function copiar(id) {
  const i = buscarInv(id);
  await navigator.clipboard.writeText(linkDe(i.token));
  mostrarMsg('Link copiado', false);
}

function whatsapp(id) {
  const i = buscarInv(id);
  const msg = `Hola ${i.nombre_corto}, con mucho cariño te invitamos a los XV años de Sheccid 🦋\n${linkDe(i.token)}`;
  // Se abre en el mismo clic para que el navegador no lo bloquee
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  if (!i.link_enviado) {
    llamar({ action: 'mark_sent', id })
      .then(() => cargar())
      .catch(err => mostrarMsg(err.message));
  }
}
</script>
</body>
</html>
