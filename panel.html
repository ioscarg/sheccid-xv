<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3d1a26">
<title>Panel de Invitados · Sheccid XV</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Raleway:wght@200;300;400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* Paleta tomada de la invitación */
:root{
  --dark:#3d1a26;
  --darker:#2a0d18;
  --blush:#fdf1f1;
  --white:#ffffff;
  --accent:#c594aa;
  --ink:#3d1a26;
  --ink2:#9a6070;
  --on-dark2:#f9d6d5;
  --line:rgba(197,148,170,.35);
  --error:#8b2a3c;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Raleway',sans-serif;font-weight:300;background:var(--blush);color:var(--ink);min-height:100vh}

/* Encabezado */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 28px;background:var(--dark);color:var(--white)}
.titulo{display:flex;flex-direction:column;line-height:1}
.titulo .nombre{font-family:'Great Vibes',cursive;font-size:34px;color:var(--white)}
.titulo .sub{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--on-dark2);margin-top:6px}

main{max-width:720px;margin:28px auto;padding:0 18px 40px}

.card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:22px;margin-bottom:18px}

/* Campos */
input{font:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--line);border-radius:4px;width:100%;background:var(--white);color:var(--ink);outline:none;transition:border-color .2s}
input::placeholder{color:var(--ink2);opacity:.7}
input:focus{border-color:var(--accent)}

/* Botones */
button{font-family:'Raleway',sans-serif;font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;border-radius:4px;border:1px solid var(--accent);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
button:hover{background:rgba(197,148,170,.12)}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--darker);border-color:var(--darker);color:var(--white)}
button.primary:hover{background:var(--dark)}
button.danger{border-color:var(--error);color:var(--error)}
button.danger:hover{background:rgba(139,42,60,.06)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin-top:12px;font-size:13px;color:var(--error);min-height:1em}
.muted{color:var(--ink2);font-size:13px}
.etiqueta{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

/* Pestañas: arriba en escritorio, barra inferior tipo app en celular */
.tabs-top{display:flex;gap:8px;margin-bottom:18px}
.tabs-top button{flex:1;padding:12px 10px}
.tabs-top button.active{background:var(--darker);border-color:var(--darker);color:var(--white)}

.tabs-bottom{display:none}

/* Lista compacta de invitados */
#buscar{margin-bottom:14px}
.lista{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--white)}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:15px 18px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:var(--white);text-align:left;color:var(--ink);text-transform:none;letter-spacing:0;font-family:'Cinzel',serif;font-size:15px;font-weight:400}
.fila:hover{background:rgba(197,148,170,.08)}
.fila:active{background:rgba(197,148,170,.16);transform:none}
.fila:last-child{border-bottom:none}
.fila .boletos{font-family:'Raleway',sans-serif;font-weight:300;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}

/* Mensajes de la invitación */
.mensajes{display:grid;gap:12px}
.msj{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:14px 16px;background:var(--white)}
.msj-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.msj-nombre{font-family:'Cinzel',serif;font-size:15px;color:var(--ink)}
.msj-fecha{font-size:11px;letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.msj-texto{font-size:15px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word}

/* Ficha del invitado */
.overlay{position:fixed;inset:0;background:rgba(61,26,38,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.overlay[hidden]{display:none}
.sheet{background:var(--white);width:100%;max-width:420px;border-radius:14px 14px 0 0;border-top:3px solid var(--accent);padding:24px 22px calc(22px + env(safe-area-inset-bottom));display:grid;gap:10px}
.sheet h2{font-family:'Cinzel',serif;font-weight:400;font-size:20px;color:var(--ink);text-align:center}
.sheet .detalle{text-align:center;margin:0 0 8px}
.sheet button{width:100%;padding:13px;text-align:center}
@media (min-width:701px){.overlay{align-items:center}.sheet{border-radius:4px;border:1px solid var(--line);border-top:3px solid var(--accent)}}

@media (max-width:700px){
  header{padding:14px 18px}
  .titulo .nombre{font-size:28px}
  main{margin:18px auto;padding:0 12px 110px}
  .card{padding:16px}
  .row{gap:8px}
  .row input,.row button{width:100%;flex:1 1 100%}
  #fBoletos{width:100%!important}
  .tabs-top{display:none}
  .tabs-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(61,26,38,.06)}
  .tabs-bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;border:none;border-radius:0;background:transparent;color:var(--ink2);font-size:10px;letter-spacing:.1em}
  .tabs-bottom button:hover{background:transparent}
  .tabs-bottom button.active{color:var(--dark)}
  .tabs-bottom button.active svg{stroke:var(--dark)}
  .tabs-bottom button.active span{font-weight:400}
  .tabs-bottom svg{width:22px;height:22px;fill:none;stroke:var(--ink2);stroke-width:1.6}
}
</style>
</head>
<body>
<header>
  <div class="titulo">
    <span class="nombre">Sheccid</span>
    <span class="sub">Panel de invitados</span>
  </div>
  <button id="btnSalir" hidden style="border-color:rgba(249,214,213,.5);color:var(--on-dark2)">Salir</button>
</header>

<main>
  <section id="login" class="card" hidden>
    <form id="formLogin" class="row">
      <input id="pass" type="password" placeholder="Contraseña del panel" autocomplete="current-password" style="flex:1;min-width:220px">
      <button class="primary" type="submit">Entrar</button>
    </form>
    <p id="loginMsg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <nav class="tabs-top">
      <button data-tab="invitados" class="active">Invitados</button>
      <button data-tab="mensajes">Mensajes</button>
    </nav>

    <!-- Pestaña: Invitados -->
    <div id="vista-invitados">
      <div class="card">
        <form id="form" class="row">
          <input id="fNombre" placeholder="Nombre (ej. Familia García)" required style="flex:2;min-width:200px">
          <input id="fBoletos" type="number" min="1" max="20" value="2" required style="width:110px">
          <button class="primary" type="submit" id="btnGuardar">Agregar invitado</button>
          <button type="button" id="btnCancelar" hidden>Cancelar</button>
        </form>
        <div id="msg" class="msg"></div>
      </div>

      <div class="card" style="padding:16px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <span id="resumen" class="etiqueta"></span>
          <button id="btnExportInv">Exportar CSV</button>
        </div>
        <input id="buscar" placeholder="Buscar por nombre…" autocomplete="off">
        <div id="lista" class="lista"></div>
      </div>
    </div>

    <!-- Pestaña: Mensajes (solo lectura) -->
    <div id="vista-mensajes" hidden>
      <div class="card" style="padding:16px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <span id="resumenMsj" class="etiqueta"></span>
          <button id="btnExportMsj">Exportar CSV</button>
        </div>
        <p id="msgMsj" class="msg" style="margin:0 0 12px"></p>
        <div id="listaMsj" class="mensajes"></div>
      </div>
    </div>
  </section>
</main>

<!-- Barra inferior (solo celular) -->
<nav class="tabs-bottom" id="tabsBottom" hidden>
  <button data-tab="invitados" class="active">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.7.2 4.6 1.9 5 4.4"/></svg>
    <span>Invitados</span>
  </button>
  <button data-tab="mensajes">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg>
    <span>Mensajes</span>
  </button>
</nav>

<!-- Ficha del invitado -->
<div id="modal" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="mNombre"></h2>
    <p id="mBoletos" class="muted detalle"></p>
    <button onclick="accion(copiar)">Copiar link</button>
    <button onclick="accion(whatsapp)">Enviar por WhatsApp</button>
    <button onclick="accion(editar)">Editar</button>
    <button class="danger" onclick="accion(eliminar)">Eliminar</button>
    <button onclick="cerrar()">Cerrar</button>
  </div>
</div>

<script>
// ===== CONFIGURACIÓN =====
const BASE = 'https://sheccid-xv.vercel.app/';
const API = '/api/invitados';
// =========================

const $ = id => document.getElementById(id);
let invitados = [];
let mensajes = [];
let editandoId = null;
let seleccionadoId = null;
let pass = sessionStorage.getItem('panelPass') || '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkDe = token => `${BASE}?token=${encodeURIComponent(token)}`;
const buscarInv = id => invitados.find(x => x.id === id);
const etiquetaBoletos = n => `${n} ${n === 1 ? 'boleto' : 'boletos'}`;
const fmtFecha = s => new Date(s).toLocaleString('es-MX', {
  day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
});

function mostrarMsg(texto, esError = true) {
  $('msg').textContent = texto;
  $('msg').style.color = esError ? 'var(--error)' : 'var(--dark)';
}

// Todas las operaciones pasan por la función de Vercel
async function llamar(body) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass, ...body }),
  });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.error || 'Error de servidor');
  return datos;
}

function mostrarPanel(activo) {
  $('login').hidden = activo;
  $('panel').hidden = !activo;
  $('tabsBottom').hidden = !activo;
  $('btnSalir').hidden = !activo;
  if (activo) cambiarTab('invitados');
}

// ===== PESTAÑAS =====
function cambiarTab(tab) {
  document.querySelectorAll('[data-tab]').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  $('vista-invitados').hidden = tab !== 'invitados';
  $('vista-mensajes').hidden = tab !== 'mensajes';
  if (tab === 'mensajes') cargarMensajes();
}
document.querySelectorAll('[data-tab]').forEach(b =>
  b.addEventListener('click', () => cambiarTab(b.dataset.tab)));

// ===== ACCESO =====
$('formLogin').onsubmit = async e => {
  e.preventDefault();
  pass = $('pass').value;
  try {
    invitados = await llamar({ action: 'list' });
    sessionStorage.setItem('panelPass', pass);
    $('loginMsg').textContent = '';
    mostrarPanel(true);
    render();
  } catch (err) {
    pass = '';
    $('loginMsg').textContent = err.message;
  }
};

$('btnSalir').onclick = () => {
  sessionStorage.removeItem('panelPass');
  pass = '';
  invitados = [];
  mensajes = [];
  cerrar();
  mostrarPanel(false);
};

async function cargar() {
  try {
    invitados = await llamar({ action: 'list' });
    render();
  } catch (err) {
    mostrarMsg(err.message);
  }
}

// Al abrir: si ya había sesión en esta pestaña, entrar directo
(async () => {
  if (pass) {
    try {
      invitados = await llamar({ action: 'list' });
      mostrarPanel(true);
      render();
      return;
    } catch { pass = ''; sessionStorage.removeItem('panelPass'); }
  }
  mostrarPanel(false);
})();

// ===== LISTA Y BÚSQUEDA DE INVITADOS =====
function render() {
  const q = $('buscar').value.trim().toLowerCase();
  // Sin texto (o al borrarlo) se muestran todos
  const lista = q
    ? invitados.filter(i => i.nombre_corto.toLowerCase().includes(q))
    : invitados;
  const totalBoletos = invitados.reduce((acc, i) => acc + (i.boletos || 0), 0);
  $('resumen').textContent = `${invitados.length} invitados · ${totalBoletos} boletos`;

  $('lista').innerHTML = lista.map(i => `
    <button class="fila" onclick="abrir('${i.id}')">
      <span>${esc(i.nombre_corto)}</span>
      <span class="boletos">${esc(etiquetaBoletos(i.boletos))}</span>
    </button>`).join('')
    || `<p class="muted" style="padding:18px;text-align:center">Sin resultados</p>`;
}

$('buscar').addEventListener('input', render);

// ===== MENSAJES DE LA INVITACIÓN (solo lectura) =====
async function cargarMensajes() {
  $('msgMsj').textContent = '';
  try {
    mensajes = await llamar({ action: 'list_rsvps' });
    renderMensajes();
  } catch (err) {
    $('msgMsj').textContent = err.message;
  }
}

function renderMensajes() {
  $('resumenMsj').textContent = `${mensajes.length} ${mensajes.length === 1 ? 'mensaje' : 'mensajes'}`;
  $('listaMsj').innerHTML = mensajes.map(m => `
    <article class="msj">
      <div class="msj-head">
        <span class="msj-nombre">${esc(m.guest_name)}</span>
        <span class="msj-fecha">${esc(fmtFecha(m.created_at))}</span>
      </div>
      <p class="msj-texto">${esc(m.message)}</p>
    </article>`).join('')
    || `<p class="muted" style="padding:18px;text-align:center">Aún no hay mensajes</p>`;
}

// ===== EXPORTAR CSV =====
function descargarCSV(nombreArchivo, filas) {
  // BOM para que Excel respete los acentos
  const csv = filas
    .map(f => f.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(','))
    .join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  a.click();
  URL.revokeObjectURL(url);
}

$('btnExportInv').onclick = () => {
  const filas = [
    ['Nombre', 'Boletos', 'Link'],
    ...invitados.map(i => [i.nombre_corto, i.boletos, linkDe(i.token)]),
  ];
  descargarCSV('invitados-sheccid-xv.csv', filas);
};

$('btnExportMsj').onclick = () => {
  if (!mensajes.length) return;
  const filas = [
    ['Nombre escrito', 'Mensaje', 'Fecha'],
    ...mensajes.map(m => [m.guest_name, m.message, fmtFecha(m.created_at)]),
  ];
  descargarCSV('mensajes-sheccid-xv.csv', filas);
};

// ===== FICHA DEL INVITADO =====
function abrir(id) {
  const i = buscarInv(id);
  if (!i) return;
  seleccionadoId = id;
  $('mNombre').textContent = i.nombre_corto;
  $('mBoletos').textContent = etiquetaBoletos(i.boletos);
  $('modal').hidden = false;
}

function cerrar() {
  $('modal').hidden = true;
  seleccionadoId = null;
}

// Cierra la ficha y ejecuta la acción sobre el invitado seleccionado
function accion(fn) {
  const id = seleccionadoId;
  cerrar();
  if (id) fn(id);
}

$('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') cerrar();
});

// ===== ALTA / EDICIÓN =====
$('form').onsubmit = async e => {
  e.preventDefault();
  const nombre_corto = $('fNombre').value.trim();
  const boletos = parseInt($('fBoletos').value, 10);
  $('btnGuardar').disabled = true;
  try {
    if (editandoId) {
      await llamar({ action: 'update', id: editandoId, nombre_corto, boletos });
    } else {
      await llamar({ action: 'create', nombre_corto, boletos });
    }
    mostrarMsg('Guardado', false);
    resetForm();
    await cargar();
  } catch (err) {
    mostrarMsg(err.message);
  } finally {
    $('btnGuardar').disabled = false;
  }
};

function resetForm() {
  editandoId = null;
  $('form').reset();
  $('fBoletos').value = 2;
  $('btnGuardar').textContent = 'Agregar invitado';
  $('btnCancelar').hidden = true;
}
$('btnCancelar').onclick = resetForm;

// ===== ACCIONES =====
function editar(id) {
  const i = buscarInv(id);
  editandoId = id;
  $('fNombre').value = i.nombre_corto;
  $('fBoletos').value = i.boletos;
  $('btnGuardar').textContent = 'Guardar cambios';
  $('btnCancelar').hidden = false;
  $('fNombre').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function eliminar(id) {
  const i = buscarInv(id);
  if (!confirm(`¿Eliminar a ${i.nombre_corto}? Su link dejará de funcionar.`)) return;
  try {
    await llamar({ action: 'delete', id });
    if (editandoId === id) resetForm();
    mostrarMsg('Eliminado', false);
    await cargar();
  } catch (err) {
    mostrarMsg(err.message);
  }
}

async function copiar(id) {
  const i = buscarInv(id);
  await navigator.clipboard.writeText(linkDe(i.token));
  mostrarMsg('Link copiado', false);
}

function whatsapp(id) {
  const i = buscarInv(id);
  const msg = `Hola ${i.nombre_corto}, con mucho cariño te invitamos a los XV años de Sheccid 🦋\n${linkDe(i.token)}`;
  // Se abre en el mismo clic para que el navegador no lo bloquee
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  if (!i.link_enviado) {
    llamar({ action: 'mark_sent', id })
      .then(() => cargar())
      .catch(err => mostrarMsg(err.message));
  }
}
</script>
</body>
</html>
